<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNG Uni Hub — Manage University</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10C30 10 15 25 15 45c0 15 10 25 20 35l15 15 15-15c10-10 20-20 20-35 0-20-15-35-35-35z' fill='%23007bff'/%3E%3Crect x='40' y='30' width='20' height='30' fill='white'/%3E%3Crect x='30' y='45' width='40' height='10' fill='white'/%3E%3C/svg%3E" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 70px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            gap: 12px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar .brand-icon {
            font-size: 28px;
            color: #fcd116;
            margin-bottom: 20px;
        }

        .sidebar .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .sidebar .nav-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .sidebar .logout-btn {
            margin-top: auto;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .sidebar .logout-btn:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 30px 40px 30px 5px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .topbar .brand i {
            color: #fcd116;
        }

        .topbar .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .topbar .admin-info .admin-badge {
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .topbar .admin-info .logout-link {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar .admin-info .logout-link:hover {
            color: #ff6b6b;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #fcd116;
        }

        /* ===== UNIVERSITY HEADER ===== */
        .uni-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }

        .uni-header .uni-logo-large {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 8px;
            flex-shrink: 0;
        }

        .uni-header .uni-logo-large img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .uni-header .uni-logo-large .placeholder-icon {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.15);
        }

        .uni-header .uni-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .uni-header .uni-info .uni-short {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ===== UPLOAD SECTIONS ===== */
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-section {
            background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .upload-section h3 {
            font-size: 16px;
            font-weight: 700;
            color: #fcd116;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-section h3 i {
            font-size: 18px;
        }

        .upload-section .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upload-section input[type="file"] {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            cursor: pointer;
        }

        .upload-section input[type="file"]::file-selector-button {
            padding: 8px 16px;
            background: rgba(252, 209, 22, 0.1);
            border: 1px solid rgba(252, 209, 22, 0.15);
            border-radius: 8px;
            color: #fcd116;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .upload-section input[type="file"]::file-selector-button:hover {
            background: rgba(252, 209, 22, 0.2);
        }

        /* ===== UPLOAD BUTTONS (Blue Gradient) ===== */
        .upload-section .upload-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1565c0 0%, #1e88e5 40%, #42a5f5 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
        }

        .upload-section .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4);
        }

        .upload-section .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== UPLOADED CONTENT LIST ===== */
        .content-list {
            margin-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
        }

        .content-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .content-item .file-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-item .file-name i {
            color: #fcd116;
        }

        .content-item .file-actions {
            display: flex;
            gap: 8px;
        }

        .content-item .file-actions .btn-delete {
            padding: 4px 12px;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .content-item .file-actions .btn-delete:hover {
            background: rgba(255, 107, 107, 0.2);
        }

        .content-item .active-badge {
            font-size: 10px;
            background: rgba(81, 207, 102, 0.15);
            color: #51cf66;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(81, 207, 102, 0.1);
        }

        .no-content {
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            padding: 8px 0;
        }

        /* ===== TOAST MESSAGE ===== */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(81, 207, 102, 0.12);
            border: 1px solid rgba(81, 207, 102, 0.15);
            color: #51cf66;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 10000;
            display: none;
            animation: slideIn 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.error {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 20px 0 10px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            width: 100%;
            margin-top: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 16px 0;
            }
            .sidebar .nav-btn,
            .sidebar .logout-btn {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
            .main-content {
                padding: 20px 20px 20px 5px;
            }
            .upload-grid {
                grid-template-columns: 1fr;
            }
            .uni-header {
                flex-direction: column;
                text-align: center;
            }
            .topbar {
                padding: 12px 18px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .topbar .brand {
                justify-content: center;
            }
            .topbar .admin-info {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                min-height: auto;
                flex-direction: row;
                padding: 10px 16px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                justify-content: center;
                gap: 8px;
                position: relative;
            }
            .sidebar .brand-icon {
                margin-bottom: 0;
                margin-right: 12px;
            }
            .sidebar .logout-btn {
                margin-top: 0;
            }
            .main-content {
                padding: 16px 16px 16px 5px;
            }
            .upload-section {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>

        <a href="javascript:history.back()" class="nav-btn" title="Back"><i class="fas fa-arrow-left"></i></a>

        <a href="../login.html" class="logout-btn" title="Logout" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i></a>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">

        <!-- ===== TOP BAR ===== -->
        <div class="topbar">
            <div class="brand">
                <i class="fas fa-graduation-cap"></i>
                <span>PNG Uni Hub — Admin</span>
            </div>
            <div class="admin-info">
                <span class="admin-badge"><i class="fas fa-crown"></i> Admin</span>
                <a href="#" class="logout-link" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <!-- ===== BACK LINK ===== -->
        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <!-- ===== UNIVERSITY HEADER ===== -->
        <div class="uni-header" id="uniHeader">
            <!-- Generated by JavaScript -->
        </div>

        <!-- ===== TOAST NOTIFICATION ===== -->
        <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">Uploaded successfully!</span></div>

        <!-- ===== UPLOAD GRID ===== -->
        <div class="upload-grid">

            <!-- ===== VIDEO UPLOAD ===== -->
            <div class="upload-section">
                <h3><i class="fas fa-video"></i> Video</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="videoInput" accept="video/mp4,video/webm,video/ogg" />
                    <button class="upload-btn" id="uploadVideoBtn"><i class="fas fa-upload"></i> Upload Video</button>
                </div>
                <div class="content-list" id="videoList">
                    <!-- Generated by JavaScript -->
                </div>
            </div>

            <!-- ===== LOGO UPLOAD ===== -->
            <div class="upload-section">
                <h3><i class="fas fa-image"></i> Logo</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" />
                    <button class="upload-btn" id="uploadLogoBtn"><i class="fas fa-upload"></i> Upload Logo</button>
                </div>
                <div class="content-list" id="logoList">
                    <!-- Generated by JavaScript -->
                </div>
            </div>

            <!-- ===== GALLERY UPLOAD ===== -->
            <div class="upload-section">
                <h3><i class="fas fa-images"></i> Gallery Images</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="galleryInput" accept="image/png,image/jpeg,image/webp" multiple />
                    <button class="upload-btn" id="uploadGalleryBtn"><i class="fas fa-upload"></i> Upload Images</button>
                </div>
                <div class="content-list" id="galleryList">
                    <!-- Generated by JavaScript -->
                </div>
            </div>

            <!-- ===== AUDIO UPLOAD ===== -->
            <div class="upload-section">
                <h3><i class="fas fa-music"></i> Background Music</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="audioInput" accept="audio/mp3,audio/wav,audio/ogg" />
                    <button class="upload-btn" id="uploadAudioBtn"><i class="fas fa-upload"></i> Upload Audio</button>
                </div>
                <div class="content-list" id="audioList">
                    <!-- Generated by JavaScript -->
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            &copy; 2025 PNG Uni Hub — Powered by DHERST
        </div>

    </div>

    <script>
        // ============================================
        // DATA: 8 Universities
        // ============================================
        const universities = [
            { id: 'unigoroka', shortName: 'UOG', fullName: 'University of Goroka' },
            { id: 'ibsu', shortName: 'IBSU', fullName: 'IBS University' },
            { id: 'dwu', shortName: 'DWU', fullName: 'Divine Word University' },
            { id: 'upng', shortName: 'UPNG', fullName: 'University of PNG' },
            { id: 'wpu', shortName: 'WPU', fullName: 'Western Pacific University' },
            { id: 'pau', shortName: 'PAU', fullName: 'Pacific Adventist University' },
            { id: 'pnguot', shortName: 'PNGUoT', fullName: 'PNG University of Technology' },
            { id: 'unre', shortName: 'UNRE', fullName: 'University of Natural Resources & Environment' }
        ];

        let currentUni = null;

        // ============================================
        // LOGOUT FUNCTION
        // ============================================
        function logoutAdmin() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = '../index.html';
        }

        // ============================================
        // GET UNIVERSITY FROM URL
        // ============================================
        function getUniversityFromURL() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            return universities.find(u => u.id === id);
        }

        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, isError) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toast.className = 'toast' + (isError ? ' error' : '');
            toastMessage.textContent = message;
            toast.style.display = 'block';
            setTimeout(function() {
                toast.style.display = 'none';
            }, 4000);
        }

        // ============================================
        // RENDER UNIVERSITY HEADER
        // ============================================
        function renderHeader() {
            const container = document.getElementById('uniHeader');
            const logoPath = `/uploads/logos/${currentUni.id}.png`;

            fetch(logoPath)
                .then(response => {
                    if (response.ok) {
                        container.innerHTML = `
                            <div class="uni-logo-large"><img src="${logoPath}" alt="${currentUni.shortName} logo" /></div>
                            <div class="uni-info">
                                <h2>${currentUni.fullName}</h2>
                                <div class="uni-short">${currentUni.shortName}</div>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <div class="uni-logo-large"><div class="placeholder-icon"><i class="fas fa-university"></i></div></div>
                            <div class="uni-info">
                                <h2>${currentUni.fullName}</h2>
                                <div class="uni-short">${currentUni.shortName}</div>
                            </div>
                        `;
                    }
                })
                .catch(() => {
                    container.innerHTML = `
                        <div class="uni-logo-large"><div class="placeholder-icon"><i class="fas fa-university"></i></div></div>
                        <div class="uni-info">
                            <h2>${currentUni.fullName}</h2>
                            <div class="uni-short">${currentUni.shortName}</div>
                        </div>
                    `;
                });
        }

        // ============================================
        // RENDER CONTENT LISTS (Check files in uploads/)
        // ============================================
        function renderContentLists() {
            renderVideoList();
            renderLogoList();
            renderGalleryList();
            renderAudioList();
        }

        function renderVideoList() {
            const container = document.getElementById('videoList');
            const videoPath = `/uploads/videos/${currentUni.id}.mp4`;

            fetch(videoPath)
                .then(response => {
                    if (response.ok) {
                        container.innerHTML = `
                            <div class="content-item">
                                <span class="file-name"><i class="fas fa-video"></i> ${currentUni.id}.mp4</span>
                                <span class="active-badge"><i class="fas fa-check"></i> Active</span>
                                <div class="file-actions">
                                    <button class="btn-delete" onclick="deleteFile('video')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `<div class="no-content">No video uploaded</div>`;
                    }
                })
                .catch(() => {
                    container.innerHTML = `<div class="no-content">No video uploaded</div>`;
                });
        }

        function renderLogoList() {
            const container = document.getElementById('logoList');
            const logoPath = `/uploads/logos/${currentUni.id}.png`;

            fetch(logoPath)
                .then(response => {
                    if (response.ok) {
                        container.innerHTML = `
                            <div class="content-item">
                                <span class="file-name"><i class="fas fa-image"></i> ${currentUni.id}.png</span>
                                <span class="active-badge"><i class="fas fa-check"></i> Active</span>
                                <div class="file-actions">
                                    <button class="btn-delete" onclick="deleteFile('logo')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `<div class="no-content">No logo uploaded</div>`;
                    }
                })
                .catch(() => {
                    container.innerHTML = `<div class="no-content">No logo uploaded</div>`;
                });
        }

        function renderGalleryList() {
            const container = document.getElementById('galleryList');
            const galleryPath = `/uploads/gallery/${currentUni.id}/`;

            fetch(galleryPath)
                .then(response => {
                    if (response.ok) {
                        // We need to list files, but we'll use the list endpoint
                        fetch(`/list/gallery/${currentUni.id}`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.files && data.files.length > 0) {
                                    let html = '';
                                    data.files.forEach((file, index) => {
                                        html += `
                                            <div class="content-item">
                                                <span class="file-name"><i class="fas fa-image"></i> ${file.name}</span>
                                                <div class="file-actions">
                                                    <button class="btn-delete" onclick="deleteGalleryFile('${file.name}')"><i class="fas fa-trash"></i> Delete</button>
                                                </div>
                                            </div>
                                        `;
                                    });
                                    container.innerHTML = html;
                                } else {
                                    container.innerHTML = `<div class="no-content">No gallery images uploaded</div>`;
                                }
                            })
                            .catch(() => {
                                container.innerHTML = `<div class="no-content">No gallery images uploaded</div>`;
                            });
                    } else {
                        container.innerHTML = `<div class="no-content">No gallery images uploaded</div>`;
                    }
                })
                .catch(() => {
                    container.innerHTML = `<div class="no-content">No gallery images uploaded</div>`;
                });
        }

        function renderAudioList() {
            const container = document.getElementById('audioList');
            const audioPath = `/uploads/audio/background_music.mp3`;

            fetch(audioPath)
                .then(response => {
                    if (response.ok) {
                        container.innerHTML = `
                            <div class="content-item">
                                <span class="file-name"><i class="fas fa-music"></i> background_music.mp3</span>
                                <span class="active-badge"><i class="fas fa-check"></i> Active</span>
                                <div class="file-actions">
                                    <button class="btn-delete" onclick="deleteFile('audio')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `<div class="no-content">No audio uploaded</div>`;
                    }
                })
                .catch(() => {
                    container.innerHTML = `<div class="no-content">No audio uploaded</div>`;
                });
        }

        // ============================================
        // DELETE FUNCTIONS
        // ============================================
        function deleteFile(type) {
            if (!confirm('Delete this file?')) return;

            const uniId = currentUni.id;
            fetch(`/delete/${uniId}/${type}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('File deleted successfully!');
                    renderContentLists();
                } else {
                    showToast('Error deleting file.', true);
                }
            })
            .catch(() => {
                showToast('Error deleting file.', true);
            });
        }

        function deleteGalleryFile(filename) {
            if (!confirm('Delete this image?')) return;

            const uniId = currentUni.id;
            fetch(`/delete/gallery/${uniId}/${filename}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('Image deleted successfully!');
                    renderContentLists();
                } else {
                    showToast('Error deleting image.', true);
                }
            })
            .catch(() => {
                showToast('Error deleting image.', true);
            });
        }

        // ============================================
        // UPLOAD FUNCTIONS (Send to Flask backend)
        // ============================================
        function uploadFile(inputId, endpoint, buttonId, buttonText) {
            const input = document.getElementById(inputId);
            const file = input.files[0];
            if (!file) {
                showToast('Please select a file first.', true);
                return;
            }

            const button = document.getElementById(buttonId);
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('uni_id', currentUni.id);

            fetch(`/upload/${endpoint}`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('Upload successful!');
                    renderContentLists();
                    input.value = '';
                    button.disabled = false;
                    button.innerHTML = buttonText;
                } else {
                    showToast('Upload failed: ' + (data.message || 'Unknown error'), true);
                    button.disabled = false;
                    button.innerHTML = buttonText;
                }
            })
            .catch(error => {
                showToast('Upload error: ' + error.message, true);
                button.disabled = false;
                button.innerHTML = buttonText;
            });
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.getElementById('uploadVideoBtn').addEventListener('click', function() {
            uploadFile('videoInput', 'video', 'uploadVideoBtn', '<i class="fas fa-upload"></i> Upload Video');
        });

        document.getElementById('uploadLogoBtn').addEventListener('click', function() {
            uploadFile('logoInput', 'logo', 'uploadLogoBtn', '<i class="fas fa-upload"></i> Upload Logo');
        });

        document.getElementById('uploadGalleryBtn').addEventListener('click', function() {
            const input = document.getElementById('galleryInput');
            const files = input.files;
            if (files.length === 0) {
                showToast('Please select at least one image.', true);
                return;
            }

            const button = document.getElementById('uploadGalleryBtn');
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

            const formData = new FormData();
            formData.append('uni_id', currentUni.id);
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            fetch('/upload/gallery', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || 'Images uploaded successfully!');
                    renderContentLists();
                    input.value = '';
                    button.disabled = false;
                    button.innerHTML = '<i class="fas fa-upload"></i> Upload Images';
                } else {
                    showToast('Upload failed: ' + (data.message || 'Unknown error'), true);
                    button.disabled = false;
                    button.innerHTML = '<i class="fas fa-upload"></i> Upload Images';
                }
            })
            .catch(error => {
                showToast('Upload error: ' + error.message, true);
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-upload"></i> Upload Images';
            });
        });

        document.getElementById('uploadAudioBtn').addEventListener('click', function() {
            uploadFile('audioInput', 'audio', 'uploadAudioBtn', '<i class="fas fa-upload"></i> Upload Audio');
        });

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Check session
            if (localStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = '../login.html';
            }

            const uni = getUniversityFromURL();
            if (!uni) {
                window.location.href = 'dashboard.html';
                return;
            }
            currentUni = uni;
            renderHeader();
            renderContentLists();
        });
    </script>

</body>
</html>
